spring.application.name=stockpilot-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpilot
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret must be at least 32 characters for HS256)
app.jwt.secret=stockpilot-super-secret-key-change-me-1234567890
app.jwt.expiration=86400000

# Uploaded files directory (files are served under /uploads/**)
app.upload.dir=./uploads

# Logging
logging.level.com.stockpilot=INFO
