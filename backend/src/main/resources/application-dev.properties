# H2 in-memory database profile - run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Great for quick demos and testing without installing PostgreSQL.
spring.datasource.url=jdbc:h2:mem:stockpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.stockpilot=INFO
